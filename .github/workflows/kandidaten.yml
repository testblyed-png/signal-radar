name: Potenzial-Kandidaten (taeglich)

on:
  schedule:
    - cron: "25 22 * * 1-5"     # nach US-Börsenschluss
  workflow_dispatch:
  push:
    branches: [kandidaten-start]

permissions:
  contents: write

concurrency:
  group: kandidaten
  cancel-in-progress: false

jobs:
  rechnen:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-actions.txt
      - name: Letzten Stand (Cache) holen
        continue-on-error: true
        run: git clone -q --depth 1 --branch kandidaten "https://github.com/${{ github.repository }}.git" kandidaten_alt
      - run: pip install -q -r requirements-actions.txt
      - run: python kandidaten.py kandidaten_neu kandidaten_alt
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SEC_IDENTITY: ${{ secrets.SEC_IDENTITY }}
      - name: Ergebnis speichern
        run: |
          cd kandidaten_neu
          git init -q -b kandidaten
          git config user.name "signal-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Kandidaten $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" kandidaten
