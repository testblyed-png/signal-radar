name: Signale aktualisieren

on:
  schedule:
    - cron: "17 */3 * * *"      # alle 3 Stunden
    - cron: "43 21 * * 1-5"     # kurz nach US-Börsenschluss
  workflow_dispatch:
  push:
    branches: [aktualisieren]   # Push auf diesen Branch = sofort neu rechnen

permissions:
  contents: write

concurrency:
  group: signale
  cancel-in-progress: false

jobs:
  rechnen:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-actions.txt
      - name: Letzten Stand (Cache) holen
        continue-on-error: true
        run: git clone -q --depth 1 --branch signale "https://github.com/${{ github.repository }}.git" vorher
      - run: pip install -r requirements-actions.txt
      - run: python export_signals.py ausgabe vorher
      - name: Ergebnis auf Branch "signale" speichern
        run: |
          cd ausgabe
          git init -q -b signale
          git config user.name "signal-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Signale $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" signale
