name: Waechter (alle 15 Minuten)

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    branches: [aktualisieren]

permissions:
  contents: write

concurrency:
  group: waechter
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q pandas numpy
      - name: Status holen
        continue-on-error: true
        run: git clone -q --depth 1 --branch waechter "https://github.com/${{ github.repository }}.git" waechter_status
      - run: python waechter.py waechter_status/status.json waechter_neu
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SEC_IDENTITY: ${{ secrets.SEC_IDENTITY }}
      - name: Status speichern
        run: |
          cd waechter_neu
          git init -q -b waechter
          git config user.name "signal-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Waechter $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" waechter
