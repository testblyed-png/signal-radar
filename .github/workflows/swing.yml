name: Swing-Backtest (woechentlich)

on:
  schedule:
    - cron: "17 6 * * 6"
  workflow_dispatch:
  push:
    branches: [swing-start]

permissions:
  contents: write

concurrency:
  group: swing
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-actions.txt
      - run: pip install -q -r requirements-actions.txt
      - run: python swing.py swing_neu
      - name: Ergebnis speichern
        run: |
          cd swing_neu
          git init -q -b swing
          git config user.name "signal-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -qm "Swing-Test $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" swing
